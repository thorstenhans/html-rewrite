spin_manifest_version = 2

[application]
name = "html-rewrite"
version = "0.1.0"
authors = ["Thorsten Hans <thorsten.hans@gmail.com>"]
description = "Anti-scraping and edge HTML rewriting"

[variables]
upstream_url = { default = "https://books.toscrape.com" }

[[trigger.http]]
route = "/..."
component = "html-rewrite"

[component.html-rewrite]
source = "target/wasm32-wasip2/release/html_rewrite.wasm"
allowed_outbound_hosts = ["{{ upstream_url }}"]

[component.html-rewrite.variables]
upstream_url = "{{ upstream_url }}"

[component.html-rewrite.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
